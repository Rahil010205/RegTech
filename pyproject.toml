[project]
name = "regtech"
version = "0.1.0"
description = "AI-powered Regulatory Compliance System"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring PostgreSQL",
    "evaluation: retrieval evaluation dataset tests",
    "slow: tests that load the real embedding model",
]
